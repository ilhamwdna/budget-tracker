<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Tracker">
<meta name="theme-color" content="#ffffff">
<title>Budget Tracker</title>
<style>
:root{--bg:#fff;--surface:#f5f5f7;--ink:#1d1d1f;--mute:#6e6e73;--faint:#86868b;--line:#d2d2d7;--soft:#e8e8ed;--track:#e3e3e8;--blue:#0071e3;--blue-text:#0058b0;--green-fill:#34c759;--green-text:#248a3d;--orange-fill:#ff9f0a;--orange-text:#b25000;--red-fill:#ff3b30;--red-text:#d70015;--sys:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sys);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0}
h1,h2{font-family:var(--sys);font-weight:700;letter-spacing:-.03em;margin:0}
h2{font-size:28px}
button,input,select{font:inherit;color:inherit}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
#shell{display:block}
#side{display:none}
#content{max-width:1100px;margin:0 auto;padding:0 20px calc(88px + env(safe-area-inset-bottom))}
#cards{display:none}
#view-data{display:none}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 6px}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.page-name{display:none}
.link{border:0;background:none;color:var(--mute);font-size:14px;padding:6px 0;cursor:pointer}
.link:hover{color:var(--ink)}
.card{background:var(--surface);border-radius:20px;padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:18px}
.lbl{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border:0;border-radius:980px;background:var(--surface);font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip.rek{border-radius:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:10px;padding:2px}
.seg.dua{grid-template-columns:repeat(2,1fr)}
.seg-btn{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:13px;cursor:pointer}
.seg-btn[aria-pressed=true]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{width:100%;padding:13px 14px;border:0;border-radius:12px;background:var(--surface);font-size:16px}
.card .field,.card .chip:not([aria-pressed=true]),.card .total,.card .sm{background:#fff}
.row2{display:flex;gap:12px}.row2>*{flex:1;min-width:0}
input[type=date]{min-width:0;max-width:100%;display:block}
@media (max-width:600px){.row-tr{flex-direction:column}}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-bottom-color:var(--blue)}
.amount span{font-size:18px;color:var(--faint)}
.amount input{border:0;background:none;outline:0;width:100%;font-size:44px;font-weight:300;letter-spacing:-.03em;padding:0;font-variant-numeric:tabular-nums;caret-color:var(--blue)}
.amount input::placeholder{color:#c7c7cc}
.primary{width:100%;padding:14px;border:0;border-radius:980px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.primary:hover{opacity:.88}
.primary:disabled{background:var(--line);color:var(--faint);cursor:default;opacity:1}
.secondary{padding:10px 18px;border:0;border-radius:980px;background:var(--soft);font-size:14px;cursor:pointer}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.total{font-size:13px;color:var(--mute);background:var(--surface);border-radius:12px;padding:12px 14px}
.total strong{color:var(--ink);font-variant-numeric:tabular-nums}
.kartu .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.bar-atas{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar-atas .ctl{display:flex;gap:8px;align-items:center}
.bar-atas select{width:auto}
.tbl{padding:8px 18px;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--mute);text-align:left;padding:11px 10px;font-size:13px;border-bottom:1px solid rgba(0,0,0,.08);white-space:nowrap}
.tbl td{padding:11px 10px;font-size:14px;border-bottom:1px solid rgba(0,0,0,.06)}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl.lebar th:first-child,.tbl.lebar td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.tbl tr.sub td{background:rgba(0,0,0,.035);font-weight:600}
.tbl tr.sel td{background:rgba(0,0,0,.05)}
.tbl td.ov{background:rgba(0,0,0,.06)}
.badge{padding:3px 10px;border-radius:980px;font-size:12px;background:var(--soft);color:var(--mute);white-space:nowrap;align-self:flex-start}
.badge.out{background:var(--soft);color:var(--mute)}.badge.in{background:#e9f7ee;color:#1b6e31}.badge.tab{background:#e8f1fd;color:var(--blue-text)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.editbtn{border:0;background:none;padding:2px 4px;font-size:13px;font-variant-numeric:tabular-nums;border-bottom:1px dashed #b8b8bd;cursor:pointer}
.pos{color:var(--green-text)}.neg{color:var(--red-text)}.oranye{color:var(--orange-text)}.biru{color:var(--blue-text)}
.tint-g{background:#e9f7ee}.tint-b{background:#e8f1fd}.tint-r{background:#fdeceb}.tint-o{background:#fff3e0}
.tint-g .note{color:#1b6e31}.tint-b .note{color:var(--blue-text)}.tint-r .note{color:#b80012}.tint-o .note{color:#9a4a00}
.tint-b .bar{background:rgba(0,113,227,.16)}
.komposisi{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0}
.komposisi i{display:block;min-width:4px}
.lgd{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.lgd .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.lgd em{font-style:normal;color:var(--faint);margin-left:6px}
.tujuan-kartu{background:var(--tt)}
.tujuan-kartu .note{color:var(--mute)}
.tujuan-kartu .bar{background:var(--tt2)}
.tujuan-kartu .bar i{background:var(--tc)}
.tujuan-kartu .pct{color:var(--td)}
.tujuan-body{display:flex;gap:14px;align-items:flex-start}
.tujuan-info{flex:1;min-width:0}
.tujuan-rinc{flex:none;width:72px;max-width:72px;text-align:center;overflow:hidden}
.tujuan-rinc .ket{margin-top:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;width:100%}
.tujuan-rinc .ket span{font-size:10px;line-height:1.3;color:var(--faint);display:flex;gap:4px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tujuan-rinc .ket .dot{flex:none;margin-top:3px}
.tujuan-rinc .dot{width:6px;height:6px;border-radius:50%}
.badge .dot,.tbl th .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sm{padding:8px 14px;border:0;border-radius:980px;background:var(--surface);font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.item{padding:12px 0;border-bottom:1px solid var(--soft)}
.item .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.item .top span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.item .sub{font-size:13px;color:var(--faint);margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--track);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-fill);border-radius:2px}
.bar.biru i{background:var(--blue)}
.hati .bar i{background:var(--orange-fill)}.hati .top span:last-child{color:var(--orange-text)}
.warn .bar i{background:var(--red-fill)}.warn .top span:last-child{color:var(--red-text)}
.sub-judul{display:flex;align-items:center;gap:6px;margin-top:22px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue-text)}
.sub-judul .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.item.tab .bar{background:rgba(0,113,227,.14)}.item.tab .bar i{background:var(--blue)}
.item.tab .top span:last-child{color:var(--blue-text)}
.err{color:var(--red-text);font-size:14px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:4px 0;font-size:10px;color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button[aria-current=true]{color:var(--blue);font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--red-text)}
main{padding-top:8px}
@media (min-width:900px){
  #shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  #side{display:flex;flex-direction:column;gap:2px;background:#fff;border-right:1px solid var(--soft);padding:26px 14px}
  #side .brand{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:0 12px 22px}
  #side button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--mute);cursor:pointer}
  #side button[aria-current=true]{background:var(--surface);color:var(--ink);font-weight:600}
  #side button.push{margin-top:auto}
  #content{max-width:none;width:100%;padding:0 38px 34px}
  header{padding:30px 0 10px}
  header h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
  .app-name{display:none}
  .page-name{display:inline}
  main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;align-items:start}
  #view-sisa,#view-data{order:1}
  #view-catat{order:2}
  #view-catat{background:var(--surface);border-radius:20px;padding:22px}
  #view-catat .field,#view-catat .chip:not([aria-pressed=true]),#view-catat .total{background:#fff}
  #cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;grid-column:1/-1}
  .view[hidden]{display:flex!important}
  nav{display:none!important}
  #toast{bottom:24px}
  body.pg-datacatat #view-data{display:flex}
  body.pg-datacatat #view-sisa,body.pg-datacatat #cards{display:none!important}
  body.pg-dataonly main{grid-template-columns:minmax(0,1fr)}
  body.pg-dataonly #view-data{display:flex}
  body.pg-dataonly #view-catat,body.pg-dataonly #view-sisa,body.pg-dataonly #cards{display:none!important}
}
</style>
</head>
<body>
<div id="shell">
  <aside id="side" aria-label="Menu utama"></aside>
  <div id="content">
    <header><h1><span class="app-name">Budget Tracker</span><span class="page-name" id="judul">Ringkasan Bulanan</span></h1><button class="link" id="btnKoneksi" type="button">Koneksi</button></header>

    <section id="setup" class="card stack" hidden></section>

    <main id="main" hidden>
      <section id="cards"></section>
      <section id="view-catat" class="view stack"></section>
      <section id="view-sisa" class="view stack" hidden></section>
      <section id="view-data" class="stack"></section>
    </main>

    <nav id="nav" hidden>
      <button type="button" data-v="catat" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Catat</button>
      <button type="button" data-v="sisa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Sisa</button>
    </nav>
    <div id="toast" role="status"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'bt_cfg_v1';
  var $ = function (s) { return document.querySelector(s); };

  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === false || v == null) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'value') e.value = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c == null || c === false) return;
        e.append(c && c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return e;
  }

  var rp = function (n) { return (n < 0 ? '-Rp' : 'Rp') + Math.abs(Math.round(n)).toLocaleString('id-ID'); };
  var digits = function (s) { return String(s || '').replace(/\D/g, ''); };
  var fmt = function (s) { var d = digits(s); return d ? Number(d).toLocaleString('id-ID') : ''; };
  function today() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  var toastTimer;
  function toast(msg, bad) {
    var t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, bad ? 5000 : 2500);
  }

  // ---------- konfigurasi & API ----------
  function loadCfg() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function saveCfg(c) { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
  var cfg = loadCfg();
  var data = null;
  var view = 'catat';
  var BULAN = null;                       // bulan terpilih (dipakai bersama oleh Sisa, Transaksi, Budget)
  function bulanAktif() { return BULAN || (data && data.bulanIni) || 1; }

  function apiGet(params) {
    var u = new URL(cfg.url);
    Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
    u.searchParams.set('token', cfg.token);
    return fetch(u.toString()).then(function (r) { return r.json(); });
  }
  function apiPost(body) {
    body.token = cfg.token;
    return fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  // ---------- setup koneksi ----------
  function showSetup(pesan) {
    $('#main').hidden = true; $('#nav').hidden = true;
    var box = $('#setup'); box.hidden = false; box.textContent = '';
    var url = h('input', { class: 'field', id: 'inUrl', type: 'url', placeholder: 'https://script.google.com/macros/s/.../exec', value: (cfg && cfg.url) || '', autocomplete: 'off' });
    var tok = h('input', { class: 'field', id: 'inTok', type: 'password', placeholder: 'Token', value: (cfg && cfg.token) || '', autocomplete: 'off' });
    var msg = h('div', { class: 'err', id: 'setupMsg', text: pesan || '' });
    var btn = h('button', { class: 'primary', type: 'button', text: 'Simpan & uji koneksi', onclick: function () {
      var u = url.value.trim(), t = tok.value.trim();
      if (!u || !t) { msg.textContent = 'URL dan token wajib diisi.'; return; }
      cfg = { url: u, token: t }; saveCfg(cfg); msg.textContent = 'Menguji...'; boot();
    } });
    box.append(
      h('h2', { text: 'Koneksi ke sheet' }),
      h('p', { class: 'note', text: 'Isi URL Web App (berakhiran /exec) dan token. Keduanya hanya disimpan di perangkat ini, tidak ada di file aplikasi. Di iPhone, aplikasi yang ditambahkan ke Layar Utama menyimpan data terpisah dari Safari, jadi isi ulang sekali di sana.' }),
      h('div', {}, h('label', { class: 'lbl', for: 'inUrl', text: 'URL Web App' }), url),
      h('div', {}, h('label', { class: 'lbl', for: 'inTok', text: 'Token' }), tok),
      btn, msg
    );
  }

  // ---------- state form catat ----------
  var f = { jenis: 'Pengeluaran', kategori: null, rekening: null, nominal: '', deskripsi: '', tanggal: today(),
            sJenis: 'Beli', kode: null, lembar: '', harga: '', biaya: '', saham: false, sending: false };
  var JENIS = ['Pengeluaran', 'Pemasukan', 'Tabungan & Investasi'];

  function rekEfektif() { return f.rekening || (data.rekeningDefault && data.rekeningDefault[f.jenis]) || null; }
  function adalahSaham() { return f.jenis === 'Tabungan & Investasi' && f.saham; }

  // teks putih di atas warna gelap, teks gelap di atas warna terang (agar tetap terbaca)
  function teksDiAtas(hex) {
    var v = [1, 3, 5].map(function (i) { var c = parseInt(hex.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    var lum = 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    return 1.05 / (lum + 0.05) >= 3 ? '#fff' : '#1d1d1f';
  }
  // rekening memakai warna jenis aset yang sama ("Mandiri" -> "Bank Mandiri", "BCA" -> "Bank BCA")
  function warnaRekening(nama) { return PALET['Bank ' + nama] || PALET[nama] || warnaJenisAset(nama); }
  function chipGroup(items, aktif, onPick, extra, warnaFn) {
    return h('div', { class: 'chips' }, items.map(function (it) {
      var w = warnaFn && it === aktif ? warnaFn(it) : null;
      return h('button', { type: 'button', class: 'chip ' + (extra || ''), 'aria-pressed': String(it === aktif), text: it,
        style: w ? 'background:' + w + ';color:' + teksDiAtas(w) : null, onclick: function () { onPick(it); } });
    }));
  }

  var JUDUL_JENIS = { 'Pengeluaran': 'Pengeluaran', 'Pemasukan': 'Pemasukan', 'Tabungan & Investasi': 'Tabungan' };
  function segmen(items, aktif, onPick) {
    return h('div', { class: 'seg', role: 'group', 'aria-label': 'Jenis transaksi' }, items.map(function (it) {
      return h('button', { type: 'button', class: 'seg-btn', 'aria-pressed': String(it === aktif), 'aria-label': it, text: JUDUL_JENIS[it] || it, onclick: function () { onPick(it); } });
    }));
  }

  function renderCatat() {
    var root = $('#view-catat'); root.textContent = '';
    var daftarKat = data.kategori[f.jenis] || [];
    if (daftarKat.indexOf(f.kategori) < 0) f.kategori = null;   // kategori awal dikosongkan, dipilih manual

    var tujuanSaham = (data.tujuanSaham || '').trim();
    var tujuanSahamValid = tujuanSaham && (data.kategoriSemua['Tabungan & Investasi'] || []).some(function (k) { return k.nama === tujuanSaham; });
    var kategoriBlok = h('div', {}, h('label', { class: 'lbl', for: 'selKat', text: 'Kategori' }),
      h('select', { class: 'field', id: 'selKat', onchange: function (e) { f.kategori = e.target.value || null; renderCatat(); } },
        [h('option', { value: '', text: 'Pilih kategori' })].concat(daftarKat.map(function (k) { return h('option', { value: k, text: k, selected: k === f.kategori }); }))));
    var infoSaham = h('div', { class: 'note', id: 'infoKategoriSaham', text: tujuanSahamValid
      ? 'Pembelian saham dicatat sebagai setoran ke ' + tujuanSaham + ' (tujuan untuk saham).'
      : 'Tujuan untuk saham belum dipilih. Pilih di Setelan, tab Tujuan aset. Tujuan itu harus juga menjadi kategori Tabungan & Investasi.' });

    root.append(
      h('h2', { text: 'Catat transaksi' }),
      segmen(JENIS, f.jenis, function (j) { f.jenis = j; f.kategori = null; f.rekening = null; f.saham = false; renderCatat(); }),
      f.jenis === 'Tabungan & Investasi'
        ? h('div', { class: 'seg dua', role: 'group', 'aria-label': 'Jenis pencatatan tabungan' }, ['Setoran', 'Saham'].map(function (t) {
            return h('button', { type: 'button', class: 'seg-btn', 'aria-pressed': String((t === 'Saham') === f.saham), text: t, onclick: function () { f.saham = t === 'Saham'; renderCatat(); } });
          }))
        : null,
      adalahSaham() ? infoSaham : kategoriBlok
    );

    var rek = rekEfektif();
    var rekNama = data.rekening.map(function (r) { return r.nama; });
    var rekBlok = h('div', {},
      h('div', { class: 'lbl', text: f.jenis === 'Tabungan & Investasi' ? 'Rekening asal dana' : 'Rekening' }),
      chipGroup(rekNama, rek, function (r) { f.rekening = r; renderCatat(); }, 'rek', warnaRekening),

      else if (i === iP) kol.push({ t: t, r: true, kelas: function (r) { return typeof r[i] === 'number' ? (r[i] >= 0 ? 'pos' : 'neg') : ''; },
        f: function (r) { return typeof r[i] === 'number' ? (r[i] >= 0 ? '+' : '') + rp(r[i]) : '–'; } });
      else kol.push({ t: t, r: true, dot: (data.jenisAset || []).indexOf(nama) >= 0 ? warnaJenisAset(nama) : null, f: function (r) { return angkaOr(r[i]); } });
    });
    root.append(tabel(kol, KK.res.baris, { kelasTabel: 'lebar' }), h('div', { class: 'note', text: 'Dibaca dari sheet Kekayaan. Angka bulan yang belum punya snapshot Aset tampil "–".' }));
  }

  // ---------- Saham ----------
  var SH = { res: null, loading: false, err: '' };
  function loadSaham() { return muat(SH, { action: 'saham' }, renderSaham2); }
  var SN = { tanggal: today(), sending: false, msg: '', ok: true };
  function blokSnapshotManual() {

      h('div', { class: 'row2' },
        h('div', {}, h('label', { class: 'lbl', for: 'snTgl', text: 'Tanggal snapshot' }),
          h('input', { class: 'field', id: 'snTgl', type: 'date', value: SN.tanggal, oninput: function (e) { SN.tanggal = e.target.value; } })),
        h('div', { style: 'display:flex;align-items:flex-end' },
          h('button', { class: 'primary', type: 'button', style: 'padding:11px;font-size:14px', disabled: SN.sending, text: SN.sending ? 'Memproses...' : 'Perbarui sekarang', onclick: jalankanSnapshot }))),

  function jalankanSnapshot() {

      function (r) { SN.sending = false; SN.msg = r.pesan; SN.ok = true; toast(r.pesan); loadSaham(); },

  function renderSaham2() {

    root.append(tabel([
      { t: 'Kode', f: function (x) { return h('strong', { text: x.kode }); } },
      { t: 'Lembar', r: true, f: function (x) { return typeof x.lembar === 'number' ? x.lembar.toLocaleString('id-ID') : '–'; } },
      { t: 'Harga rata-rata', r: true, f: function (x) { return angkaOr(x.rata); } },
      { t: 'Modal', r: true, f: function (x) { return angkaOr(x.modal); } },
      { t: 'Harga sekarang', r: true, f: function (x) { return angkaOr(x.sekarang); } },
      { t: 'Nilai pasar', r: true, f: function (x) { return angkaOr(x.pasar); } },
      { t: 'Untung/rugi', r: true, kelas: function (x) { return typeof x.ur === 'number' ? (x.ur >= 0 ? 'pos' : 'neg') : ''; },
        f: function (x) { return typeof x.ur === 'number' ? (x.ur >= 0 ? '+' : '') + rp(x.ur) + (typeof x.urPct === 'number' ? ' (' + pct(x.urPct) + ')' : '') : '–'; } },
      { t: 'Bobot', r: true, f: function (x) { return typeof x.bobot === 'number' ? (x.bobot * 100).toFixed(1).replace('.', ',') + '%' : '–'; } },
      { t: 'Terealisasi', r: true, kelas: function (x) { return typeof x.real === 'number' && x.real !== 0 ? (x.real >= 0 ? 'pos' : 'neg') : ''; },
        f: function (x) { return typeof x.real === 'number' && x.real !== 0 ? (x.real >= 0 ? '+' : '') + rp(x.real) : '–'; } }
    ], SH.res.baris), h('div', { class: 'note', text: 'Harga dari GOOGLEFINANCE, bisa tertunda dari harga bursa. Untuk mencatat beli/jual, gunakan form di sebelah kanan.' }));
  }

  // ---------- Setelan ----------
  var ST = { tab: 'Rekening', nama: '', ket: '', msg: '', ok: true, sending: false };
  var SLOT = { rekening: 9, tujuan: 7, emiten: 8 };
  function refreshInit() {
    return apiGet({ action: 'init' }).then(function (r) { if (r && r.ok) { data = r; renderCatat(); renderSetelan(); loadTujuan(); } });
  }
  function renderSetelan() {
    var root = $('#view-data'); root.textContent = '';
    root.append(barAtas('Setelan'));
    root.append(h('div', { class: 'chips' }, ['Rekening', 'Tujuan aset', 'Kode saham', 'Kategori'].map(function (t) {
      return h('button', { type: 'button', class: 'chip', 'aria-pressed': String(t === ST.tab), text: t, onclick: function () { ST.tab = t; ST.nama = ''; ST.ket = ''; ST.msg = ''; renderSetelan(); } });
    })));
    var tab = ST.tab, isKat = tab === 'Kategori';
    var semua = data.kategoriSemua || {};   // jaga-jaga bila Jembatan belum diperbarui
    JENIS.forEach(function (j) { if (!semua[j]) semua[j] = (data.kategori[j] || []).map(function (n) { return { nama: n, hidden: false }; }); });
    var daftar, slotInfo = '', tipe = null, labelNama = '', ph = '', labelKet = '', phKet = '', catat = '';
    if (tab === 'Rekening') { tipe = 'rekening'; daftar = data.rekening.map(function (r) { return { nama: r.nama, ket: r.peran }; }); slotInfo = daftar.length + ' dari ' + SLOT.rekening + ' slot terpakai'; labelNama = 'Nama rekening'; ph = 'Contoh: GoPay'; labelKet = 'Peran (opsional)'; phKet = 'Contoh: e-wallet'; catat = 'Rekening baru langsung muncul di pilihan saat mencatat transaksi.'; }
    if (tab === 'Tujuan aset') { tipe = 'tujuan'; daftar = data.tujuan.map(function (n) { return { nama: n, ket: '' }; }); slotInfo = daftar.length + ' dari ' + SLOT.tujuan + ' slot terpakai'; labelNama = 'Nama tujuan'; ph = 'Contoh: Dana liburan'; catat = 'Dipakai di kolom Tujuan pada snapshot aset.'; }
    if (tab === 'Kode saham') { tipe = 'emiten'; daftar = data.emiten.map(function (n) { return { nama: n, ket: '' }; }); slotInfo = daftar.length + ' dari ' + SLOT.emiten + ' slot terpakai'; labelNama = 'Kode emiten'; ph = 'Contoh: BBCA'; catat = 'Tanpa awalan IDX. Kode yang tidak dikenali GOOGLEFINANCE tampil "tidak tersedia" di Portofolio.'; }

    var kiri = h('div', { class: 'card stack', style: 'gap:8px' }, h('div', { style: 'font-weight:700', text: tab }));
    if (isKat) {
      JENIS.forEach(function (j) {
        kiri.append(h('div', { class: 'note', style: 'margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em', text: j }));
        (semua[j] || []).forEach(function (k) {
          kiri.append(h('div', { style: 'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft)' },
            h('span', { style: k.hidden ? 'color:#86868b;text-decoration:line-through' : 'font-weight:600', text: k.nama }),
            k.hidden ? h('span', { class: 'note', style: 'font-size:12px', text: 'Disembunyikan' }) : null,
            h('button', { type: 'button', class: 'secondary', style: 'margin-left:auto;padding:6px 12px;font-size:12px', text: k.hidden ? 'Tampilkan' : 'Sembunyikan', onclick: function () { sembunyi(k); } })));
        });
      });
      kiri.append(h('div', { class: 'note', style: 'margin-top:8px', text: 'Kategori yang disembunyikan tidak muncul di pilihan saat mencatat, tapi riwayat dan budgetnya tetap ada. Menambah kategori baru belum tersedia dari aplikasi karena butuh slot cadangan di sheet.' }));
    } else if (tab === 'Tujuan aset') {
      kiri.append(h('div', { class: 'note', text: slotInfo }));
      if (!TJ.res) {
        daftar.forEach(function (d) { kiri.append(h('div', { style: 'padding:8px 0;border-bottom:1px solid var(--soft);font-weight:600', text: d.nama })); });
        kiri.append(h('div', { class: 'note', style: 'margin-top:8px', text: TJ.err ? TJ.err : 'Memuat target...' }));
      } else {
        TJ.res.baris.forEach(function (x) {
          var inT = h('input', { class: 'sm', type: 'text', inputmode: 'numeric', placeholder: 'Target (Rp)', 'aria-label': 'Target ' + x.nama, value: typeof x.target === 'number' ? fmt(String(x.target)) : '', autocomplete: 'off', style: 'width:150px', oninput: function (e) { e.target.value = fmt(e.target.value); } });
          var inD = h('input', { class: 'sm', type: 'date', 'aria-label': 'Tanggal target ' + x.nama, value: x.tanggalTarget || '' });
          kiri.append(h('div', { style: 'display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0;border-bottom:1px solid var(--soft)' },
            h('span', { style: 'font-weight:600;min-width:130px', text: x.nama }), inT, inD,
            h('button', { type: 'button', class: 'secondary', style: 'padding:8px 12px;font-size:12px', text: 'Simpan', onclick: function () {
              kirimData({ action: 'tujuanSet', nama: x.nama, target: inT.value === '' ? '' : Number(digits(inT.value)), tanggal: inD.value },
                function () { ST.msg = 'Target ' + x.nama + ' tersimpan.'; ST.ok = true; loadTujuan(); toast('Target tersimpan'); },
                function (m) { ST.msg = m; ST.ok = false; renderSetelan(); toast(m, true); });
            } })));
        });
        var katSetoran = (data.kategoriSemua['Tabungan & Investasi'] || []).map(function (k) { return k.nama; });
        var selSaham = h('select', { class: 'sm', 'aria-label': 'Tujuan untuk saham', onchange: function (e) {
          var pilih = e.target.value;
          kirimData({ action: 'tujuanSet', tujuanSaham: pilih },
            function () { data.tujuanSaham = pilih; ST.msg = pilih ? 'Saham dihitung ke ' + pilih + '.' : 'Saham tidak dialokasikan.'; ST.ok = true; renderCatat(); loadTujuan(); },
            function (m) { ST.msg = m; ST.ok = false; renderSetelan(); toast(m, true); });
        } }, [h('option', { value: '', text: 'Tidak dialokasikan' })].concat(TJ.res.baris.filter(function (x) { return katSetoran.indexOf(x.nama) >= 0; }).map(function (x) { return h('option', { value: x.nama, text: x.nama, selected: x.nama === TJ.res.tujuanSaham }); })));
        kiri.append(h('div', { style: 'margin-top:12px' }, h('div', { class: 'lbl', text: 'Tujuan untuk saham' }), selSaham,
          h('div', { class: 'note', style: 'margin-top:6px', text: 'Baris Aset berjenis Saham yang Tujuannya kosong dihitung ke tujuan ini, dan pembelian saham dicatat sebagai setoran ke tujuan ini. Hanya tujuan yang juga menjadi kategori Tabungan & Investasi yang bisa dipilih (Cash on Hand diisi manual di Aset).' })));
      }
    } else {
      kiri.append(h('div', { class: 'note', text: slotInfo }));
      daftar.forEach(function (d) { kiri.append(h('div', { style: 'display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)' }, h('span', { style: 'font-weight:600', text: d.nama }), h('span', { class: 'note', text: d.ket }))); });
    }

    var kanan = null;
    if (!isKat) {
      kanan = h('div', { class: 'card stack', style: 'gap:12px' },
        h('div', { style: 'font-weight:700', text: 'Tambah ' + tab.toLowerCase() }),
        h('div', {}, h('label', { class: 'lbl', for: 'stNama', text: labelNama }), h('input', { class: 'field', id: 'stNama', type: 'text', value: ST.nama, placeholder: ph, autocomplete: 'off', oninput: function (e) { ST.nama = e.target.value; } })),
        labelKet ? h('div', {}, h('label', { class: 'lbl', for: 'stKet', text: labelKet }), h('input', { class: 'field', id: 'stKet', type: 'text', value: ST.ket, placeholder: phKet, autocomplete: 'off', oninput: function (e) { ST.ket = e.target.value; } })) : null,
        h('div', { class: 'note', text: catat }),
        h('button', { class: 'primary', type: 'button', style: 'padding:11px;font-size:14px', disabled: ST.sending, text: 'Tambah ke sheet', onclick: function () { tambahMaster(tipe); } }));
    }
    var pesan = panelPesan(ST.msg, ST.ok);
    if (pesan) (kanan || kiri).append(pesan);
    root.append(kanan ? h('div', { class: 'split' }, kiri, kanan) : kiri);
  }
  function tambahMaster(tipe) {
    if (ST.sending) return;
    if (!ST.nama.trim()) { ST.msg = 'Isi nama dulu.'; ST.ok = false; renderSetelan(); return; }
    ST.sending = true; renderSetelan();
    kirimData({ action: 'masterTambah', tipe: tipe, nama: ST.nama.trim(), ket: ST.ket.trim() },
      function () { ST.sending = false; ST.msg = ST.nama.trim() + ' ditambahkan.'; ST.ok = true; ST.nama = ''; ST.ket = ''; refreshInit(); },
      function (m) { ST.sending = false; ST.msg = m; ST.ok = false; renderSetelan(); toast(m, true); });
  }
  function sembunyi(k) {
    kirimData({ action: 'kategoriSembunyi', nama: k.nama, sembunyi: !k.hidden },
      function () { ST.msg = k.hidden ? k.nama + ' ditampilkan kembali.' : k.nama + ' disembunyikan dari pilihan.'; ST.ok = true; refreshInit(); },
      function (m) { ST.msg = m; ST.ok = false; renderSetelan(); toast(m, true); });
  }

  // ---------- sidebar & halaman (layar lebar) ----------
  var MENU = ['Ringkasan', 'Transaksi', 'Budget', 'Aset', 'Kekayaan', 'Saham', 'Setelan'];
  var KELAS = { Ringkasan: 'pg-ringkasan', Transaksi: 'pg-datacatat', Saham: 'pg-datacatat', Budget: 'pg-dataonly', Aset: 'pg-dataonly', Kekayaan: 'pg-dataonly', Setelan: 'pg-dataonly' };
  var MUAT = { Transaksi: loadTransaksi, Budget: loadBudget, Aset: loadAset, Kekayaan: loadKekayaan, Saham: loadSaham, Setelan: function () { loadTujuan(); renderSetelan(); } };
  var page = 'Ringkasan';
  function renderSide() {
    var side = $('#side'); side.textContent = '';
    side.append(h('div', { class: 'brand', text: 'Budget Tracker' }));
    MENU.forEach(function (m) {
      side.append(h('button', { type: 'button', 'aria-current': String(m === page), text: m, onclick: function () { setPage(m); } }));
    });
  }
  function setPage(m) {
    page = m;
    var b = document.body;
    ['pg-ringkasan', 'pg-datacatat', 'pg-dataonly'].forEach(function (c) { b.classList.remove(c); });
    b.classList.add(KELAS[m]);
    $('#judul').textContent = m === 'Ringkasan' ? 'Ringkasan Bulanan' : m;
    renderSide();
    if (!data) return;
    if (m === 'Saham') { f.jenis = 'Tabungan & Investasi'; f.kategori = null; f.saham = true; f.rekening = null; renderCatat(); }
    if (MUAT[m]) MUAT[m]();
  }
  function setBulan(n) {
    BULAN = n; loadSisa();
    if (page === 'Transaksi') loadTransaksi();
    if (page === 'Budget') loadBudget();
  }

  // ---------- navigasi & boot ----------
  function setView(v) {
    view = v;
    $('#view-catat').hidden = v !== 'catat'; $('#view-sisa').hidden = v !== 'sisa';
    [].forEach.call(document.querySelectorAll('nav button'), function (b) { b.setAttribute('aria-current', String(b.getAttribute('data-v') === v)); });
  }
  [].forEach.call(document.querySelectorAll('nav button'), function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-v')); }); });
  $('#btnKoneksi').addEventListener('click', function () { showSetup(''); });

  function boot() {
    if (!cfg || !cfg.url || !cfg.token) { showSetup(''); return; }
    apiGet({ action: 'init' }).then(function (r) {
      if (!r || !r.ok) { showSetup((r && r.error) || 'Gagal memuat data.'); return; }
      data = r; $('#setup').hidden = true; $('#main').hidden = false; $('#nav').hidden = false;
      setView(view); renderCatat(); loadSisa(); setPage(page);
    }).catch(function () { showSetup('Tidak bisa terhubung. Periksa URL dan koneksi internet.'); });
  }
  renderSide();
  boot();
})();
</script>
